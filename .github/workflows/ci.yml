name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      # npm test = next build + 全量 E2E(独立测试库 data/test.db + OCR mock,见 playwright.config.ts)
      - name: 构建 + 端到端测试
        run: npm test

      - name: OCR provider 单测
        run: npx tsx tests/ocr-provider.mjs

      # 失败时上传报告(HTML + 每用例截图 + trace),Actions 页面可下载回放
      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
